[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# 轨AD D（2026-11-25）：发行包名从旧名 errcode-atlas 改为产品名 byteproof。
# PyPI 旧名实测 404（未发布），走「改名」分支；旧包目录 src/errcode_atlas 与旧入口暂留（截止 2026-11-30）。
name = "byteproof"
version = "0.1.0"
description = "三平台错误码与退出码判定表：给定「数字 + 平台 + 语境」，判它能否被唯一归因"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "yuluo554" }]
keywords = ["errno", "exit-code", "signals", "posix", "error-code", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Debuggers",
  "Typing :: Typed",
]
# 运行期零第三方依赖：判定层只用标准库，编目随包分发为冻结 JSON。
dependencies = []

[project.optional-dependencies]
# 仅在生成侧（tools/build_catalog.py）需要 YAML 解析器。
dev = ["pytest>=7.4", "PyYAML>=6.0"]

[project.scripts]
errcode-atlas = "errcode_atlas.cli:main"
# Stage 1 产品入口；errcode-atlas 是过渡期旧入口，器官迁移完成后删除（届时全仓只剩 byteproof）
byteproof = "byteproof.cli:main"

[project.urls]
Homepage = "https://github.com/yuluo554/byteproof"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
errcode_atlas = ["data/*.json", "py.typed"]
# 器官的静态数据（规则包 + 阈值表）必须随包分发：器官不读文件，
# 但宿主 CLI 要在没给 --basis 时读到规则包；`pip wheel` 后包里 data/ 为空
# 就等于"装上了但审不了"。
byteproof = ["py.typed", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"